name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    # The path-containment rules behave differently on Windows (case-insensitive
    # paths, drive letters) than on POSIX, and the IPC layer uses named pipes on
    # Windows versus Unix domain sockets elsewhere. Both are load-bearing, so both
    # are tested rather than assumed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check sources and tests
        run: npm run typecheck

      # The end-to-end suite runs dist/gateway.js as a subprocess, so the bundles
      # must exist before the tests run.
      - name: Build bundles
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify the extension packages cleanly
        run: npx --yes @vscode/vsce package --no-dependencies --out mcp-shield-ci.vsix

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: mcp-shield-vsix
          path: mcp-shield-ci.vsix
